<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BNGL Expander</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .left, .right {
      flex: 1;
      min-width: 300px;
    }

    textarea {
      width: 100%;
      height: 90px;
      margin-bottom: 5px;
    }

    pre {
      background: #f0f0f0;
      padding: 10px;
      white-space: pre-wrap;
      max-height: 300px; /* Set the desired max height */
      overflow: auto;    /* Enable scrollbars if content overflows */
    }

    .file-input {
      font-size: 1rem;
      padding: 8px;
      width: 100%;
      margin-bottom: 20px;
    }

  </style>
</head>
<body>
  <h2>BNGL Expression Expander</h2>

  <div class="container">
    <!-- Left column: input controls -->
    <div class="left">
      <div style="margin-bottom: 30px;">
        <label for="fileInput">Upload BNGL File:</label><br>
        <input type="file" id="fileInput" class="file-input" accept=".bngl,.txt" onchange="loadFile(event)">
        <small>Will extract content for <code>molecules</code>, <code>observables</code>, and <code>reactions</code></small>
      </div>

      <label for="moltext">Molecule Types and Expressions (BNGL Format):</label><br>
      <textarea id="moltext"></textarea><br>

      <textarea id="expr"></textarea><br>

      <button onclick="expand()">Expand</button>
    </div>

    <!-- Right column: result/output -->
    <div class="right">
      <h3>Result:</h3>
      <pre><code id="result"></code></pre>
      <a id="downloadLink"
         style="display: none; margin-top: 10px; padding: 6px 10px; background: #4ba0fb; color: white; text-decoration: none; border-radius: 2px;"
         download>
        ⬇ Save Expanded File
      </a>
    </div>
  </div>
</body>

  <script>
    let uploadedFileName = "output";

    function hasDuplicateSiteNames(sites) {
    const seen = new Set();
    for (const s of sites) {
      const base = s.split('~')[0].split('!')[0];
      if (seen.has(base)) return true;
      seen.add(base);
    }
    return false;
    }

    function moleculeSiteDict(moleculeLines) {
      const molSiteDict = {};
      for (const line of moleculeLines) {
        const trimmed = line.trim();
        if (trimmed.startsWith("#") || !trimmed.includes("(")) continue;
        const match = trimmed.match(/^([A-Za-z0-9_]+)\((.*?)\)/);
        if (!match) continue;
        const molecule = match[1];
        const sitesBlock = match[2];
        const sites = sitesBlock.split(',').map(s => s.trim()).filter(s => s.length > 0);
        molSiteDict[molecule] = sites;
      }
      return molSiteDict;
    }

    function expandExpr(bnglExpr, molSiteDict) {
      const chunks = bnglExpr.split('.');
      const expandedChunks = [];

      for (let chunk of chunks) {
        chunk = chunk.trim();

        if (chunk.includes('(') && chunk.includes(')')) {
          const molEndIdx = chunk.indexOf('(');
          const exprEndIdx = chunk.indexOf(')');
          const molName = chunk.slice(0, molEndIdx);
          const inside = chunk.slice(molEndIdx + 1, exprEndIdx);

          const molSites = molSiteDict[molName] || [];
          const inputSites = inside.split(',').map(s => s.trim()).filter(Boolean);
          const usePosition = hasDuplicateSiteNames(molSites);

          const allSites = [];
          
          if (usePosition) {
            const seenCount = {};
            const inputMap = {};

            for (let s of inputSites) {
                const base = s.split('~')[0].split('!')[0];
                seenCount[base] = (seenCount[base] || 0) + 1;
                const key = `${base}[${seenCount[base] - 1}]`;
                inputMap[key] = s;
            }

            const molCount = {};
            for (let site of molSites) {
                const base = site.split('~')[0].split('!')[0];
                molCount[base] = (molCount[base] || 0) + 1;
                const key = `${base}[${molCount[base] - 1}]`;
                const s = inputMap[key];
                if (s !== undefined) {
                    allSites.push(s.includes('!') ? s : `${s}!-`);
                } else {
                    allSites.push(`${site}!?`);
                }
            }
          } else {
          const givenSites = {};
          for (const s of inside.split(',')) {
            const trimmed = s.trim();
            const sBase = trimmed.split('~')[0].split('!')[0];
            givenSites[sBase] = trimmed;
          }

          const sites = molSiteDict[molName] || [];

          for (let site of sites) {
            const base = site.split('~')[0].split('!')[0];
            if (givenSites.hasOwnProperty(base)) {
              let s = givenSites[base];
              if (!s.includes('!')) {
                s += '!-';
              }
              allSites.push(s);
            } else {
              site += '!?';
              allSites.push(site);
            }
          }
        }
          expandedChunks.push(`${molName}(${allSites.join(',')})`);
        } else {
          expandedChunks.push(chunk);
        }
      }

      return expandedChunks.join('.');
    }

    function expand() {
      const exprBlock = document.getElementById('expr').value.trim();
      const molLines = document.getElementById('moltext').value.split('\n');
      const molSiteDict = moleculeSiteDict(molLines);

      const exprLines = exprBlock.split('\n').filter(line => line.trim() !== '');
      let expandedIndex = 0;
      const updatedLines = originalLines.slice();

      // Expand observables
      for (const idx of obsBlockIndices) {
        const expanded = expandExpr(exprLines[expandedIndex], molSiteDict);
        updatedLines[idx] = updatedLines[idx].replace(/(.*?\s+.*?\s+).*/, `$1${expanded}`);
        expandedIndex++;
      }

      // Expand reactions (expand inline, not from exprLines)
      for (const idx of rxnBlockIndices) {
        const originalLine = originalLines[idx];
        const trimmed = originalLine.trim();
        if (trimmed === "" || trimmed.startsWith("#")) continue;

        const reactionParts = originalLine.split(/:(.+)/);
        const prefix = reactionParts.length === 3 ? reactionParts[0] + ':' : '';
        const body = reactionParts.length === 3 ? reactionParts[1].trim() : originalLine.trim();

        const arrowMatch = body.match(/(.*?)\s*(<[-=]+>|[-=]+>)\s*(.*)/);
        if (!arrowMatch) {
          updatedLines[idx] = originalLine;
          continue;
        }

        const [, lhs, arrow, rhsWithRates] = arrowMatch;

        // Separate RHS molecules from rate constants/comments
        const rhsParts = rhsWithRates.split(/\s{2,}/);
        const rhs = rhsParts[0];
        const rateConstantsAndComment = rhsParts.slice(1).join('  ');

        const expandSide = (side) =>
          side.split(/(?<!!)\+/).map(part => {
            const trimmed = part.trim();
            const moleculeParts = trimmed.split('.');

            const expandedParts = moleculeParts.map(subpart => {
              const match = subpart.match(/^(@[A-Za-z0-9_]+:)?(.+)$/);
              const location = match?.[1] || "";
              const expr = match?.[2] || subpart;

              return location + expandExpr(expr, molSiteDict);
            });

            return expandedParts.join('.');
          }).join(' + ');

        const newLHS = expandSide(lhs);
        const newRHS = expandSide(rhs);

        const expandedLine = `${prefix} ${newLHS} ${arrow} ${newRHS}    ${rateConstantsAndComment}`;
        updatedLines[idx] = expandedLine;
      }

      // Display result
      const fullResult = updatedLines.join('\n');
      document.getElementById('result').textContent = fullResult;

      const blob = new Blob([fullResult], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const downloadLink = document.getElementById('downloadLink');
      downloadLink.href = url;
      downloadLink.download = `_expanded_${uploadedFileName}.bngl`;
      downloadLink.style.display = 'inline';
    }



    let originalLines = []; // Store all file lines
    let obsBlockIndices = [];
    let rxnBlockIndices = [];

    function loadFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      uploadedFileName = file.name.replace(/\.[^/.]+$/, "");

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        originalLines = content.split('\n');

        let inMolBlock = false;
        let inObsBlock = false;
        let inRxnBlock = false;

        const molLines = [];
        const obsExprs = [];
        const rxnExprs = [];

        obsBlockIndices = [];
        rxnBlockIndices = [];

        for (let i = 0; i < originalLines.length; i++) {
          const trimmed = originalLines[i].trim();

          if (trimmed.toLowerCase().startsWith("begin molecule")) {
            inMolBlock = true;
            continue;
          }
          if (trimmed.toLowerCase().startsWith("end molecule")) {
            inMolBlock = false;
            continue;
          }
          if (trimmed.toLowerCase() === "begin observables") {
            inObsBlock = true;
            continue;
          }
          if (trimmed.toLowerCase() === "end observables") {
            inObsBlock = false;
            continue;
          }
          if (trimmed.toLowerCase().startsWith("begin reaction")) {
            inRxnBlock = true;
            continue;
          }
          if (trimmed.toLowerCase().startsWith("end reaction")) {
            inRxnBlock = false;
            continue;
          }

          if (inMolBlock) {
            molLines.push(trimmed);
          }

          if (inObsBlock) {
            obsBlockIndices.push(i);
            const tokens = trimmed.split(/\s+/);
            if (tokens.length >= 3) {
              const rawExpr = tokens.slice(2).join(' ');
              const cleanedExpr = rawExpr.replace(/@\w+:/g, '');
              obsExprs.push({ original: originalLines[i], expr: cleanedExpr });
            }
          }

          if (inRxnBlock) {
            if (trimmed.startsWith('#') || trimmed === "") continue;
            rxnBlockIndices.push(i);

            const lineBody = trimmed.includes(':') ? trimmed.split(/:(.+)/)[1].trim() : trimmed;
            const noRates = lineBody.replace(/\s+[^()\s<->+=,]+(?:\s*,\s*[^()\s<->+=,]+)?\s*$/, '').trim();
            const cleanedReaction = noRates.trim();
            rxnExprs.push({ original: originalLines[i], expr: cleanedReaction });
          }
        }

        document.getElementById('moltext').value = molLines.join('\n');
        document.getElementById('expr').value = [...obsExprs.map(o => o.expr), ...rxnExprs.map(r => r.expr)].join('\n');
      };

      reader.readAsText(file);
    }

  </script>

</body>
</html>
